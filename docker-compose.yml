services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dozentenmanager:dev
    container_name: dozentenmanager-dev
    # Run as root in dev so host volume mounts are readable (Podman/Docker on macOS)
    user: "0:0"
    ports:
      - "5001:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:////app/instance/dozentenmanager.db
      - UPLOAD_FOLDER=uploads
      - MAX_CONTENT_LENGTH=16777216
      - LOG_LEVEL=DEBUG
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - DOZENTENMANAGER_API_KEY=${DOZENTENMANAGER_API_KEY:-}
    volumes:
      - ./app:/app/app
      - ./cli:/app/cli
      - ./run.py:/app/run.py
      - ./config.py:/app/config.py
      - ./migrations:/app/migrations
      - ./instance:/app/instance
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    command: dozentenmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/auth/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
